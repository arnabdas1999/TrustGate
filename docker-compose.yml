# docker compose up --build
# web  -> http://localhost:3000
# api  -> http://localhost:8000
# gate -> internal only (port 8100 is never published outside the Docker network)

services:
  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      GATE_URL: http://gate:8100
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - gate

  gate:
    build: .
    command: ["uvicorn", "gate.service:app", "--host", "0.0.0.0", "--port", "8100"]
    # Only the gate reads the Flagsmith organisation key.
    env_file:
      - path: .env.gate
        required: false
    expose:
      - "8100"
    volumes:
      - ./data/gate:/app/data/gate

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
