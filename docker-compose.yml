# docker compose up --build
# web  -> http://localhost:3000
# api  -> http://localhost:8000
# gate -> internal only (port 8100 is never published outside the Docker network)

services:
  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      GATE_URL: http://gate:8100
      # Match WEB_PORT if you change it (e.g. WEB_PORT=3001 WEB_ORIGIN=http://localhost:3001)
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # With MOCK=0 the orchestrator uses the real search (sandbox replays + ddmin)
      TRUSTGATE_SEARCH: ${TRUSTGATE_SEARCH:-sandbox}
    # Lets the api reach Ollama on the host: LLM_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - gate

  gate:
    build: .
    command: ["uvicorn", "gate.service:app", "--host", "0.0.0.0", "--port", "8100"]
    # Only the gate reads the Flagsmith organisation key.
    env_file:
      - path: .env.gate
        required: false
    expose:
      - "8100"
    volumes:
      - ./data/gate:/app/data/gate

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      # Host port is configurable when 3000 is taken: WEB_PORT=3001 docker compose up
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
